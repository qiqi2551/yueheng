<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>月衡 · 消费预测</title>
<meta name="description" content="记录花销，预测月底总额，按限额算出每天能花多少。数据只存在本机。">
<meta name="theme-color" content="#F2F4F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="月衡">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
      <span class="brand-name">月衡</span>
    </div>
    <div class="topmonth" id="topMonth"></div>
  </header>

  <main class="view" id="view" role="main"></main>

  <nav class="tabbar" id="tabbar" role="tablist">
    <button class="tab is-active" data-view="overview" type="button" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15.5 9.2 9l3.9 4 6.4-8.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19.5h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>概览</span>
    </button>
    <button class="tab" data-view="list" type="button" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5h12M8 12h12M8 17.5h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4.5" cy="6.5" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="17.5" r="1.2" fill="currentColor"/></svg>
      <span>明细</span>
    </button>
    <button class="tab tab-add" type="button" data-action="open-sheet" aria-label="记一笔">
      <span class="add-circle">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </span>
    </button>
    <button class="tab" data-view="settings" type="button" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.2v2.2M12 18.6v2.2M20.8 12h-2.2M5.4 12H3.2M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6M18.2 18.2l-1.6-1.6M7.4 7.4 5.8 5.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<!-- 记账面板 -->
<div class="sheet-root" id="sheetRoot" aria-hidden="true">
  <div class="sheet-mask" data-action="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="记一笔">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <button class="head-btn" type="button" data-action="close-sheet">取消</button>
      <span class="sheet-title">记一笔</span>
      <button class="head-btn head-btn--primary" type="button" data-action="save-txn" id="saveBtn" disabled>保存</button>
    </div>

    <div class="amount-line">
      <span class="amount-cur">¥</span><span class="amount-val" id="amtVal">0</span><span class="caret" aria-hidden="true"></span>
    </div>

    <div class="entry-meta">
      <div class="chips-row">
        <button class="chip" type="button" data-date="today">今天</button>
        <button class="chip" type="button" data-date="yesterday">昨天</button>
        <label class="chip chip--date">
          <span id="dateChipLabel">选日期</span>
          <input type="date" id="dateInput" aria-label="选择日期">
        </label>
      </div>
      <input class="note-input" id="noteInput" type="text" placeholder="备注（可选）" maxlength="24" enterkeyhint="done">
    </div>

    <div class="cats" id="catRow"></div>

    <div class="keypad" id="keypad">
      <button class="key" type="button" data-key="1">1</button>
      <button class="key" type="button" data-key="2">2</button>
      <button class="key" type="button" data-key="3">3</button>
      <button class="key" type="button" data-key="4">4</button>
      <button class="key" type="button" data-key="5">5</button>
      <button class="key" type="button" data-key="6">6</button>
      <button class="key" type="button" data-key="7">7</button>
      <button class="key" type="button" data-key="8">8</button>
      <button class="key" type="button" data-key="9">9</button>
      <button class="key" type="button" data-key=".">.</button>
      <button class="key" type="button" data-key="0">0</button>
      <button class="key key--fn" type="button" data-key="del" aria-label="删除">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9L3 12l6-7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 9.5 17 14.5M17 9.5 12 14.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="modal-root" id="modalRoot" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./js/finance.js"></script>
<script src="./js/store.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
